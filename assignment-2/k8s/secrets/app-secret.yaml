# Base64-encoded, NOT encrypted at rest by default (see README).
# DB_USER must equal POSTGRES_USER; DB_PASSWORD must equal POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: dso202-secret
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
type: Opaque
stringData:
  DB_USER: "taskuser"
  DB_PASSWORD: "taskpass"
  POSTGRES_USER: "taskuser"
  POSTGRES_PASSWORD: "taskpass"
