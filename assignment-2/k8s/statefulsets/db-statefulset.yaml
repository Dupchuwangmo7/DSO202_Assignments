apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: database}
spec:
  serviceName: db-svc            # must match the headless Service
  replicas: 1                    # no replication configured: do NOT scale up
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0               # update every ordinal; raise to hold Pods back
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain          # deleting the StatefulSet keeps the data
    whenScaled: Retain           # scaling down keeps the data
  selector:
    matchLabels: {app: task-tracker, tier: database}
  template:
    metadata:
      labels: {app: task-tracker, tier: database}
    spec:
      serviceAccountName: db-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: database
          image: sarojsanyasi/dso202-db:1.0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA       # subdirectory avoids "directory not empty" on some volumes
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: dso202-config, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: dso202-secret, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: dso202-secret, key: POSTGRES_PASSWORD}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data               # PVC becomes data-db-0
        labels: {app: task-tracker, tier: database}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi         # storageClassName omitted: kind's default "standard"
