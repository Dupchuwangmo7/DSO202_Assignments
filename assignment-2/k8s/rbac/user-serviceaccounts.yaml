# Identities that stand in for people. kind has no user database, so a
# ServiceAccount is the simplest way to demonstrate and test human roles.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, purpose: human-access}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, purpose: human-access}
automountServiceAccountToken: false
