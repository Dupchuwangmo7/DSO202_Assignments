# One ServiceAccount per workload. None of the three containers ever calls the
# Kubernetes API, so none is granted any Role, and the API token is not mounted.
# (Roles for human users are added in the RBAC stage.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: frontend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: backend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: database}
automountServiceAccountToken: false
