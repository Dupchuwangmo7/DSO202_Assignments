# Cluster for Assignment 2. Host ports 80/443 are forwarded to fixed NodePorts
# 30080/30443 on the kind node; the Ingress controller (next stage) will
# expose itself on those NodePorts, so this file works with any controller.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
