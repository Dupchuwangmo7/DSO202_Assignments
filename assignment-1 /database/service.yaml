# Headless Service -- clusterIP: None -- so cluster DNS resolves directly
# to the database Pod's IP within the namespace only. Never NodePort/LB.
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: dso202-assignment-01
  labels:
    tier: database
spec:
  clusterIP: None
  selector:
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
