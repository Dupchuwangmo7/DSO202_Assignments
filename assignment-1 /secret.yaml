# Credential values only. DO NOT commit real production credentials this way --
# stringData is used here purely so kubectl handles the base64 encoding for us;
# Kubernetes still stores the Secret as base64 in etcd, which is NOT
# encryption at rest by default (see README "Secret encoding caveat").
#
# DB_USER must match POSTGRES_USER, DB_PASSWORD must match POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: dso202-secret
  namespace: dso202-assignment-01
type: Opaque
stringData:
  DB_USER: "taskuser"
  DB_PASSWORD: "taskpass"
  POSTGRES_USER: "taskuser"
  POSTGRES_PASSWORD: "taskpass"
